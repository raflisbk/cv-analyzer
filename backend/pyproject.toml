[project]
name = "cv-analyzer-backend"
version = "0.1.0"
description = "CV Analyzer backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]==0.32.0",
    "celery[redis]==5.4.0",
    "redis==5.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[pool]==3.2.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.6.0",
    "PyMuPDF>=1.25.0",
    "python-docx==1.1.0",
    "easyocr==1.7.0",
    "opencv-python>=4.8.0",
    "pdf2image==1.17.0",
    "pillow==10.4.0",
    "python-magic==0.4.27",
    "langdetect==1.0.9",
    "boto3==1.34.0",
    "aiofiles==24.1.0",
    "loguru==0.7.2",
    "sentry-sdk[fastapi]==2.18.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "slowapi==0.1.9",
    "alembic==1.13.1",
    "spacy>=3.7",
    "rapidfuzz>=3.0",
    "openai>=1.0",
    "httpx>=0.27.0,<0.28.0",
    "zai-sdk>=0.2.0",
    "tenacity>=8.0",
    "pgvector>=0.3.0",
    "pycrdt-websocket>=0.1.0",
    "python-jose[cryptography]>=3.3.0",
    "google-auth>=2.0.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.24.0",
    "json-repair>=0.30.0",
    "replicate>=0.34.0",
    # Linux/Railway: apt-get install -y libpango-1.0-0 libcairo2 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
    # Windows dev: conda install -n sbk-cv-analyzer -c conda-forge weasyprint
    # weasyprint 60.0 + pydyf 0.8.0 is the last known-compatible pair on PyPI (2025-04).
    # Newer weasyprint versions require pydyf.PDF(version, identifier) which pydyf ≤0.12.1 doesn't support.
    "weasyprint==60.0",
    "pydyf==0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hatch
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | _build
  | build
  | dist
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific rules
]

ignore = [
    "E501",    # line too long (handled by black)
    "B008",    # do not perform function call in argument defaults
    "PLR0913", # too many arguments
    "TRY003",  # avoid specifying long messages outside exception class
    "UP046",   # Generic[T] syntax required for Python 3.11 compatibility
    "PLR2004", # magic value used in comparison
    "TRY300",  # consider moving this statement to an else block
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLC0415", # import should be at the top-level of a file
    "N815",    # mixedCase variable in class scope (API contract fields)
    "ARG001",  # unused function argument (interface contracts)
    "ARG002",  # unused method argument (interface contracts)
    "RUF012",  # mutable class attributes should be annotated with ClassVar
    "RUF001",  # ambiguous unicode character (intentional en-dashes etc.)
    "EM101",   # exception must not use a string literal
    "EM102",   # exception must not use an f-string literal
    "TRY301",  # abstract raise to an inner function
    "PLW2901", # for loop variable overwritten by assignment target
    "I001",   # import block un-sorted (black handles import formatting)
    "UP042",  # replace str+Enum with StrEnum (intentional for compatibility)
    "N806",    # non-lowercase variable in function
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["ARG", "PLR2004"]  # Allow magic values in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
