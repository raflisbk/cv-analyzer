<style>@page{size:A4;margin:14mm}body{font-family:Arial,sans-serif;color:#111;font-size:9pt;line-height:1.25}h1{font-size:17pt;margin:0 0 4pt}h2{font-size:10pt;text-transform:uppercase;border-bottom:1px solid #777;margin:8pt 0 2pt}p{margin:1.5pt 0}</style>
{% for section in sections %}<section>{% if loop.first %}<h1>{{ section.lines[0] if section.lines else '' }}</h1>{% else %}<h2>{{ section.title }}</h2>{% endif %}{% for line in (section.lines[1:] if loop.first else section.lines) %}{% if line %}<p>{{ line }}</p>{% endif %}{% endfor %}</section>{% endfor %}
