<style>@page{size:A4;margin:20mm}body{font-family:Georgia,serif;color:#222;font-size:10.5pt;line-height:1.42}h1{font-size:21pt;margin:0 0 9pt}h2{font-size:12pt;text-transform:uppercase;border-bottom:1px solid #555;padding-bottom:3pt;margin:14pt 0 5pt}p{margin:3pt 0}</style>
{% for section in sections %}<section>{% if loop.first %}<h1>{{ section.lines[0] if section.lines else '' }}</h1>{% else %}<h2>{{ section.title }}</h2>{% endif %}{% for line in (section.lines[1:] if loop.first else section.lines) %}{% if line %}<p>{{ line }}</p>{% endif %}{% endfor %}</section>{% endfor %}
