name: CI and Auto-merge

on:
  push:
    branches:
      - "dev"
  pull_request:
    branches:
      - "main"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies and QA tools
        run: |
          uv pip install --system -e backend
          uv pip install --system "black>=26.0" "ruff>=0.15" pytest pytest-asyncio

      - name: Backend formatting (Black)
        run: black --check backend

      - name: Backend lint (Ruff)
        run: ruff check backend

      - name: Backend tests (Pytest)
        env:
          CV_ANALYZER_HF_API_KEY: ci-dummy-key
          CV_ANALYZER_DB_HOST: localhost
          CV_ANALYZER_DB_NAME: cv-analyzer
          CV_ANALYZER_DB_USER: postgres
          CV_ANALYZER_DB_PASSWORD: dummy
          CV_ANALYZER_REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  auto-merge:
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close conflicting PRs first
          REPO="${{ github.repository }}"
          gh pr list --repo $REPO --base main --head dev --state open --json number --jq '.[].number' | while read pr; do
            MERGEABLE=$(gh pr view $pr --repo $REPO --json mergeable --jq '.mergeable')
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "Closing conflicting PR #$pr"
              gh pr close $pr --repo $REPO --delete-branch=false
            fi
          done

          # Find or create a clean PR
          OPEN_PR=$(gh api "repos/$REPO/pulls?base=main&head=dev&state=open" --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            OPEN_PR=$(gh api "repos/$REPO/pulls" \
              --method POST \
              --field title="auto: merge dev → main" \
              --field body="Auto-generated PR from push to dev. CI passed." \
              --field head="dev" \
              --field base="main" \
              --jq '.number')
            echo "Created PR #$OPEN_PR"
            # Wait briefly for GitHub to compute mergeability
            sleep 5
          fi

          gh api "repos/$REPO/pulls/$OPEN_PR/merge" \
            --method PUT \
            --field commit_title="auto: merge dev → main (${{ github.sha }})" \
            --field commit_message="" \
            --field merge_method="merge"
