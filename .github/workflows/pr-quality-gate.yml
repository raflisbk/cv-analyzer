name: PR Quality Gate

on:
  pull_request:
    branches:
      - "main"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies and QA tools
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install black ruff pytest pip-audit

      - name: Backend formatting (Black)
        run: black --check backend

      - name: Backend lint (Ruff)
        run: ruff check backend

      - name: Backend tests (Pytest)
        run: pytest backend/tests

      - name: Backend security scan (pip-audit)
        run: pip-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend security scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high