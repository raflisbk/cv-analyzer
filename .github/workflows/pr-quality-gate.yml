name: CI and Auto-merge

on:
  push:
    branches:
      - "dev"
  pull_request:
    branches:
      - "main"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies and QA tools
        run: |
          uv pip install --system -e backend
          uv pip install --system "black>=26.0" "ruff>=0.15" pytest pytest-asyncio

      - name: Backend formatting (Black)
        run: black --check backend

      - name: Backend lint (Ruff)
        run: ruff check backend

      - name: Backend tests (Pytest)
        env:
          CV_ANALYZER_HF_API_KEY: ci-dummy-key
          CV_ANALYZER_DB_HOST: localhost
          CV_ANALYZER_DB_NAME: cv-analyzer
          CV_ANALYZER_DB_USER: postgres
          CV_ANALYZER_DB_PASSWORD: dummy
          CV_ANALYZER_REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  auto-merge:
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
      - name: Find or create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          OPEN_PR=$(gh api "repos/$REPO/pulls?base=main&head=dev&state=open" --jq '.[0].number // empty')

          if [ -n "$OPEN_PR" ]; then
            echo "PR_NUMBER=$OPEN_PR" >> "$GITHUB_ENV"
            echo "Using existing PR #$OPEN_PR"
          else
            PR_NUMBER=$(gh api "repos/$REPO/pulls" \
              --method POST \
              --field title="auto: merge dev → main" \
              --field body="Auto-generated PR from push to dev. CI passed." \
              --field head="dev" \
              --field base="main" \
              --jq '.number')
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
            echo "Created PR #$PR_NUMBER"
          fi

      - name: Wait for PR quality-gate check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for quality-gate to pass on PR #${{ env.PR_NUMBER }}..."
          for i in $(seq 1 20); do
            PASSED=$(gh pr checks ${{ env.PR_NUMBER }} 2>/dev/null | grep "quality-gate" | grep -c "pass" || true)
            echo "Attempt $i/20: passed checks = $PASSED"
            if [ "$PASSED" -ge 1 ]; then
              echo "quality-gate passed!"
              sleep 3
              exit 0
            fi
            sleep 10
          done
          echo "Timeout — attempting merge anyway"
          exit 0

      - name: Merge PR (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/merge" \
            --method PUT \
            --field commit_title="auto: merge dev → main (${{ github.sha }})" \
            --field commit_message="" \
            --field merge_method="squash"
